sonar.projectKey=storytold_lightcraft
sonar.organization=storytold
sonar.coverage.exclusions=**/tools/**,**/docs/**,**/examples/**

# Setting sonar.tests without sonar.sources stops the scanner defaulting to the whole repository,
# which left only the packaging test indexed and the main branch analysed as empty.
sonar.sources=.

# Keep packaging tests analyzed as tests, outside production coverage metrics.
sonar.tests=packaging/linux/flatpak
sonar.test.inclusions=packaging/linux/flatpak/test_*.py
sonar.exclusions=packaging/linux/flatpak/test_*.py
sonar.python.coverage.reportPaths=python-coverage.xml
